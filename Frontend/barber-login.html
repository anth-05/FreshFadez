<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Barber login — Fresh Fadez Studios</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#121417">
<link rel="icon" type="image/png" href="./images/logo-mark-dark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..800&display=swap">
<style>
/* Barber portal entry: single dark screen, same tokens as the public site. */
:root{
  --ink:#121417;
  --ink-2:#1E2226;
  --line-dark:rgba(255,255,255,.14);
  --muted-dark:#9AA0A6;
  --ice:#D7D9DB;
  --ice-ink:#121417;
  --white:#FFFFFF;
  --danger:#F2A399;
  --font:'Archivo', 'Helvetica Neue', Arial, sans-serif;
  --ease-out:cubic-bezier(.23,1,.32,1);
  color-scheme: dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;min-height:100vh;min-height:100dvh;background:var(--ink);color:var(--white);font-family:var(--font);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
img{display:block;max-width:100%}
a,button{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--ice);outline-offset:3px}

.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:calc(18px + env(safe-area-inset-top,0px)) 24px 18px}
.brand{display:flex;align-items:center;gap:12px;color:var(--white);text-decoration:none}
.brand .bw{display:flex;flex-direction:column;gap:5px;line-height:1}
.brand .bn{font-size:15px;font-weight:700;font-stretch:112%;letter-spacing:.02em}
.brand .bs{font-size:11px;letter-spacing:.4em;color:var(--muted-dark)}
.back{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line-dark);color:var(--white);text-decoration:none;font-size:14px;font-weight:600}
.lang{display:flex;gap:6px}
.lang button{min-height:40px;min-width:44px;border-radius:999px;border:1px solid var(--line-dark);background:none;color:var(--muted-dark);font:600 13px/1 var(--font);letter-spacing:.04em;cursor:pointer}
.lang button[aria-pressed="true"]{border-color:var(--ice);color:var(--white)}
.top-right{display:flex;align-items:center;gap:10px}

main{flex:1;display:flex;align-items:center;justify-content:center;padding:32px 16px 56px}
.card{width:100%;max-width:420px;animation:rise 600ms var(--ease-out) both}
@keyframes rise{from{opacity:.001;transform:translateY(14px)}to{opacity:1;transform:none}}
h1{margin:0;font-size:clamp(34px,7vw,44px);line-height:1.05;font-weight:650;font-stretch:114%;letter-spacing:-.02em}
.lede{margin:14px 0 32px;color:var(--muted-dark);font-size:16px;line-height:1.6}

form{display:flex;flex-direction:column;gap:18px}
label{display:block;margin-bottom:8px;font-size:14px;font-weight:600}
.field{width:100%;min-height:52px;padding:0 16px;border-radius:12px;border:1px solid var(--line-dark);background:var(--ink-2);color:var(--white);font:500 16px/1 var(--font);transition:border-color 160ms ease}
.field::placeholder{color:#8A9096}
.field:focus{outline:none;border-color:var(--ice)}
.field[aria-invalid="true"]{border-color:var(--danger)}
.pw-wrap{position:relative}
.pw-wrap .field{padding-right:84px}
.pw-toggle{position:absolute;right:6px;top:50%;transform:translateY(-50%);min-height:40px;padding:0 12px;border:0;border-radius:8px;background:none;color:var(--muted-dark);font:600 13px/1 var(--font);cursor:pointer}
.err{margin:8px 0 0;font-size:13px;color:var(--danger)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:14px}
.check{display:inline-flex;align-items:center;gap:10px;color:var(--muted-dark);cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--ice);margin:0}
.row a{color:var(--muted-dark);text-underline-offset:4px}
::selection{background:var(--ice);color:var(--ice-ink)}
input{caret-color:var(--ice)}
/* Fingers need 44px targets; mouse users keep the denser sizes. */
@media (pointer:coarse){
  .back,.lang button,.pw-toggle{min-height:44px}
  .check,.row a{min-height:44px;display:inline-flex;align-items:center}
  .check input{width:22px;height:22px}
  .brand{min-height:44px;padding-right:8px}
}
.submit{min-height:52px;margin-top:6px;border:0;border-radius:999px;background:var(--ice);color:var(--ice-ink);font:600 16px/1 var(--font);cursor:pointer;transition:transform 160ms var(--ease-out),background-color 200ms ease}
.submit:active{transform:scale(.97);transition-duration:100ms}
.submit[disabled]{opacity:.6;cursor:default}
.notice{margin:0;padding:14px 16px;border-radius:12px;border:1px solid var(--line-dark);background:var(--ink-2);font-size:14px;color:var(--muted-dark)}
.help{margin:28px 0 0;font-size:13px;color:var(--muted-dark);text-align:center}

@media (hover:hover) and (pointer:fine){
  .back:hover,.lang button:hover{border-color:rgba(255,255,255,.4)}
  .submit:not([disabled]):hover{background:#C7CACD}
  .row a:hover,.pw-toggle:hover{color:var(--white)}
}
@media (max-width:560px){
  .top{padding-inline:16px}
  .brand .bw{display:none}
  .back span{display:none}
}
@media (prefers-reduced-motion: reduce){
  .card{animation:none}
  .submit,.field{transition:none}
}
</style>
</head>
<body>

<header class="top">
  <a class="brand" href="./index.html">
    <img src="./images/logo-mark-white.png" alt="Fresh Fadez Studios" width="38" height="24">
    <span class="bw"><span class="bn">FRESHFADEZ</span><span class="bs">STUDIOS</span></span>
  </a>
  <div class="top-right">
    <div class="lang">
      <button type="button" data-lang="nl" aria-pressed="true">NL</button>
      <button type="button" data-lang="en" aria-pressed="false">EN</button>
    </div>
    <a class="back" href="./index.html">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
      <span data-i18n="back">Terug naar site</span>
    </a>
  </div>
</header>

<main>
  <div class="card">
    <h1 data-i18n="title">Welkom terug</h1>
    <p class="lede" data-i18n="lede">Log in op het barber portal om je agenda, afspraken en beschikbaarheid te beheren.</p>

    <form id="login-form" novalidate>
      <div>
        <label for="email" data-i18n="email">E-mailadres</label>
        <input class="field" id="email" name="email" type="email" autocomplete="username" inputmode="email" required aria-describedby="email-err">
        <p class="err" id="email-err" hidden></p>
      </div>
      <div>
        <label for="password" data-i18n="password">Wachtwoord</label>
        <div class="pw-wrap">
          <input class="field" id="password" name="password" type="password" autocomplete="current-password" required aria-describedby="password-err">
          <button type="button" class="pw-toggle" id="pw-toggle" aria-controls="password" aria-pressed="false" data-i18n="show">Toon</button>
        </div>
        <p class="err" id="password-err" hidden></p>
      </div>
      <div class="row">
        <label class="check" style="margin:0;font-weight:500"><input type="checkbox" id="remember"> <span data-i18n="remember">Ingelogd blijven</span></label>
        <a href="#" id="forgot" data-i18n="forgot">Wachtwoord vergeten?</a>
      </div>
      <p class="notice" id="notice" role="status" hidden></p>
      <button type="submit" class="submit" id="submit" data-i18n="submit">Inloggen</button>
    </form>

    <p class="help" data-i18n="help">Alleen voor medewerkers van Fresh Fadez Studios.</p>
  </div>
</main>

<script>
(function(){
  var I18N = {
    nl: {
      back:'Terug naar site', title:'Welkom terug',
      lede:'Log in op het barber portal om je agenda, afspraken en beschikbaarheid te beheren.',
      email:'E-mailadres', password:'Wachtwoord', show:'Toon', hide:'Verberg',
      remember:'Ingelogd blijven', forgot:'Wachtwoord vergeten?', submit:'Inloggen',
      help:'Alleen voor medewerkers van Fresh Fadez Studios.',
      err_email:'Vul een geldig e-mailadres in.', err_password:'Vul je wachtwoord in.',
      forgot_note:'Neem contact op met je websitebeheerder om je wachtwoord te resetten.',
      submitting:'Bezig met inloggen…',
      bad_login:'E-mailadres of wachtwoord klopt niet.',
      too_many:'Te veel pogingen. Probeer het over 15 minuten opnieuw.',
      network:'Kan de server niet bereiken. Controleer je verbinding en probeer opnieuw.',
      server:'Er ging iets mis. Probeer het later opnieuw.'
    },
    en: {
      back:'Back to site', title:'Welcome back',
      lede:'Sign in to the barber portal to manage your schedule, appointments and availability.',
      email:'Email address', password:'Password', show:'Show', hide:'Hide',
      remember:'Keep me signed in', forgot:'Forgot password?', submit:'Sign in',
      help:'For Fresh Fadez Studios staff only.',
      err_email:'Enter a valid email address.', err_password:'Enter your password.',
      forgot_note:'Contact your website admin to reset your password.',
      submitting:'Signing in…',
      bad_login:'Email or password is incorrect.',
      too_many:'Too many attempts. Try again in 15 minutes.',
      network:'Can’t reach the server. Check your connection and try again.',
      server:'Something went wrong. Please try again later.'
    }
  };

  var API_BASE = (location.hostname === 'localhost' || location.hostname === '127.0.0.1')
    ? 'http://localhost:3000/api'
    : 'https://freshfadez-api.onrender.com/api';
  var SESSION_KEY = 'ff-barber-session';
  var PORTAL_URL = './barber-portal.html';

  // "Keep me signed in" keeps the session in localStorage; otherwise it dies with the browser session.
  function readSession(){
    var raw = null;
    try { raw = localStorage.getItem(SESSION_KEY) || sessionStorage.getItem(SESSION_KEY); } catch(e){}
    try {
      var s = JSON.parse(raw);
      return s && s.token && new Date(s.expiresAt) > new Date() ? s : null;
    } catch(e){ return null; }
  }
  function saveSession(session, remember){
    try {
      localStorage.removeItem(SESSION_KEY);
      sessionStorage.removeItem(SESSION_KEY);
      (remember ? localStorage : sessionStorage).setItem(SESSION_KEY, JSON.stringify(session));
    } catch(e){}
  }

  if (readSession()) { location.replace(PORTAL_URL); return; }

  var lang = 'nl';
  try { lang = localStorage.getItem('ff-lang') || 'nl'; } catch(e){}
  if (!I18N[lang]) lang = 'nl';
  function t(k){ return I18N[lang][k]; }

  var form = document.getElementById('login-form');
  var email = document.getElementById('email');
  var password = document.getElementById('password');
  var pwToggle = document.getElementById('pw-toggle');
  var notice = document.getElementById('notice');
  var submitBtn = document.getElementById('submit');
  var remember = document.getElementById('remember');
  var noticeKey = null;

  function applyLanguage(){
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-i18n]').forEach(function(el){
      var k = el.dataset.i18n;
      if (el === pwToggle) k = password.type === 'password' ? 'show' : 'hide';
      if (el === submitBtn && submitBtn.disabled) k = 'submitting';
      el.textContent = t(k);
    });
    document.querySelectorAll('[data-lang]').forEach(function(b){
      b.setAttribute('aria-pressed', b.dataset.lang === lang ? 'true' : 'false');
    });
    if (noticeKey) notice.textContent = t(noticeKey);
    ['email','password'].forEach(function(id){
      var err = document.getElementById(id + '-err');
      if (!err.hidden) err.textContent = t('err_' + id);
    });
  }
  document.querySelectorAll('[data-lang]').forEach(function(b){
    b.addEventListener('click', function(){
      lang = b.dataset.lang;
      try { localStorage.setItem('ff-lang', lang); } catch(e){}
      applyLanguage();
    });
  });

  pwToggle.addEventListener('click', function(){
    var show = password.type === 'password';
    password.type = show ? 'text' : 'password';
    pwToggle.setAttribute('aria-pressed', show ? 'true' : 'false');
    pwToggle.textContent = t(show ? 'hide' : 'show');
  });

  function showNotice(k){ noticeKey = k; notice.textContent = t(k); notice.hidden = false; }
  function setError(input, bad){
    var err = document.getElementById(input.id + '-err');
    input.setAttribute('aria-invalid', bad ? 'true' : 'false');
    err.hidden = !bad;
    err.textContent = bad ? t('err_' + input.id) : '';
  }
  [email, password].forEach(function(input){
    input.addEventListener('input', function(){ if (input.getAttribute('aria-invalid') === 'true') setError(input, false); });
  });

  document.getElementById('forgot').addEventListener('click', function(e){
    e.preventDefault();
    showNotice('forgot_note');
  });

  form.addEventListener('submit', function(e){
    e.preventDefault();
    var emailBad = !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value.trim());
    var pwBad = !password.value;
    setError(email, emailBad);
    setError(password, pwBad);
    if (emailBad) { email.focus(); return; }
    if (pwBad) { password.focus(); return; }

    notice.hidden = true; noticeKey = null;
    submitBtn.disabled = true;
    submitBtn.textContent = t('submitting');
    fetch(API_BASE + '/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: email.value.trim(), password: password.value, remember: remember.checked })
    }).then(function(res){
      if (res.ok) return res.json().then(function(session){
        saveSession(session, remember.checked);
        location.replace(PORTAL_URL);
      });
      if (res.status === 401) { showNotice('bad_login'); password.value = ''; password.focus(); }
      else if (res.status === 429) showNotice('too_many');
      else showNotice('server');
      resetSubmit();
    }).catch(function(){
      showNotice('network');
      resetSubmit();
    });
  });

  function resetSubmit(){
    submitBtn.disabled = false;
    submitBtn.textContent = t('submit');
  }

  applyLanguage();
})();
</script>
</body>
</html>
